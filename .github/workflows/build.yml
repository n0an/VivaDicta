name: Build Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

env:
  # Keep in step with the Xcode used for release builds. The app uses APIs
  # that older SDKs lack, so a stale pin here fails the build.
  XCODE_VERSION: "27.2"

jobs:
  build:
    runs-on: xcode-27

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version

      - name: Install xcbeautify
        run: command -v xcbeautify || brew install xcbeautify

      - name: Resolve Swift Packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -workspace ./VivaDicta.xcodeproj/project.xcworkspace \
            -scheme VivaDicta

      - name: Pick simulator
        run: echo "SIMULATOR_UDID=$(.github/scripts/pick-simulator.sh)" >> "$GITHUB_ENV"

      - name: Build
        run: |
          # Without pipefail the step reports xcbeautify's exit status, and a
          # failed build shows up as a green check.
          set -o pipefail
          xcodebuild build \
            -scheme VivaDicta \
            -workspace ./VivaDicta.xcodeproj/project.xcworkspace \
            -destination "platform=iOS Simulator,id=${SIMULATOR_UDID}" \
            -configuration Debug \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee xcodebuild.log | xcbeautify

      - name: Upload raw log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
