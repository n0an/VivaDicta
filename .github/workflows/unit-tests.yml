name: Unit-tests

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Keep in step with the Xcode used for release builds. The app uses APIs
  # that older SDKs lack, so a stale pin here fails the build.
  XCODE_VERSION: "27.2"

jobs:
  test:
    runs-on: xcode-27

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version

      - name: Install xcbeautify
        run: command -v xcbeautify || brew install xcbeautify

      # Xcode ships the Metal compiler as a separate download and the runner
      # image does not include it; a dependency compiles .metal shaders.
      - name: Install Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Resolve Swift Packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -workspace ./VivaDicta.xcodeproj/project.xcworkspace \
            -scheme VivaDicta

      - name: List available simulators
        run: |
          xcrun simctl list runtimes
          xcrun simctl list devices available

      - name: Pick simulator
        run: echo "SIMULATOR_UDID=$(.github/scripts/pick-simulator.sh)" >> "$GITHUB_ENV"

      - name: Boot simulator
        run: |
          xcrun simctl boot "$SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b

      - name: Run Tests
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme VivaDicta \
            -workspace ./VivaDicta.xcodeproj/project.xcworkspace \
            -destination "platform=iOS Simulator,id=${SIMULATOR_UDID}" \
            -configuration Debug \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee xcodebuild.log | xcbeautify

      - name: Upload raw log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
